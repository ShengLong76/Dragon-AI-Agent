<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dragon AI — Grok Voice waveform</title>
  <link rel="stylesheet" href="../../../branding/fonts/syne/dragon-ui.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #f0f0f5;
      font-family: Syne, ui-sans-serif, system-ui, sans-serif;
    }
    .shell {
      display: flex;
      min-height: 100vh;
    }
    [data-slot="sidebar"] {
      box-sizing: border-box;
      flex: 0 0 220px;
      padding: 16px;
      background: #1c1c20;
    }
    .chat {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      background: #000;
    }
    .chat-header {
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #2a2a30;
      color: #c4c4ce;
    }
    [data-slot="aui_thread"] {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 0;
      padding: 16px 24px;
    }
    [data-slot="aui_composer"] {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 24px 24px;
      padding: 8px 10px 8px 14px;
    }
    [data-slot="aui_composer"] textarea {
      flex: 1 1 auto;
      min-height: 28px;
      border: 0;
      background: transparent;
      color: #f0f0f5;
      resize: none;
    }
    [data-slot="aui_composer"] > button[aria-label="Add"] {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #c4c4ce;
      font-size: 1.25rem;
    }
    .native-session {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 24px 10px;
      padding: 10px 14px;
      border: 1px solid #2a2a30;
      border-radius: 999px;
      background: #141416;
      color: #c4c4ce;
    }
    [data-slot="rail"] {
      flex: 0 0 260px;
      background: #111114;
      border-left: 1px solid #2a2a30;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside data-slot="sidebar">BOTS</aside>
    <div class="chat">
      <header class="chat-header">Chief of Staff</header>
      <main data-slot="aui_thread" data-chat-surface>
        <div data-slot="aui_assistant-message-root">
          <div data-slot="aui_assistant-message-content">
            Click the waveform on the composer to open Grok Voice. Capsule must dock at the top of this chat column.
          </div>
        </div>
        <div data-slot="aui_user-message-root">
          <div class="composer-human-message">Open the floating capsule.</div>
        </div>
      </main>
      <div class="native-session">Speaking response <span>settings · mute</span></div>
      <form data-slot="aui_composer" data-dragon-ai-composer-chrome>
        <button type="button" aria-label="Add">+</button>
        <textarea placeholder="Message Chief of Staff" rows="1"></textarea>
        <button type="button" data-slot="aui_composer-speech" aria-label="Voice">mic</button>
      </form>
    </div>
    <aside data-slot="rail"></aside>
  </div>
  <script src="../../../branding/voice/dragon-voice-selector.js"></script>
</body>
</html>
