# Dragon AI Agent — embedded gateway (Bot Screen capable)
# Windows + Docker Desktop Linux engine. Bind to loopback only.
#
# Usage:
#   docker compose -f docker-compose.embedded.yml pull
#   docker compose -f docker-compose.embedded.yml up -d
#
# Image: official desktop-suffixed tag (TigerVNC + Xfce baked in).
# No secrets beyond local-only dashboard / Desktop-session placeholders below.
#
# Surfaces (all published on 127.0.0.1 only):
#   :8642  OpenAI-compatible API (`gateway run`) — NOT the Desktop Remote URL
#   :9119  Web dashboard (password-gated) — optional browser login, not the product window
#   :8650  Desktop-compatible `hermes serve` (loopback + TCP proxy) — Bot Screen API only
#   :8660  `hermes dashboard` web UI (loopback + TCP proxy) — the window DragonAIAgent.exe opens
# GET / on :8650 is headless ("web UI disabled"). Do not load that URL in the window.

name: airmaze-embedded

services:
  hermes-gateway:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-gw
    restart: unless-stopped
    # Heal root-owned logs/backups on the Windows bind mount, then exec the
    # official dispatcher (/init + stage2 + s6-setuidgid hermes). Do not drop
    # /init from the chain and do not run gateway as root.
    entrypoint: ["/bin/sh", "/opt/dragon/start-gateway.sh"]
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
      # Shared by sidecars (network_mode: service:hermes-gateway).
      - "127.0.0.1:8650:8650"
      - "127.0.0.1:8660:8660"
    volumes:
      - ${HERMES_EMBEDDED_DATA:-${USERPROFILE}/.hermes-airmaze-embedded}:/opt/data
      - ./scripts/airmaze/start-gateway.sh:/opt/dragon/start-gateway.sh:ro
      - ./scripts/airmaze/patch_grok_voice_mode.py:/opt/dragon/patch_grok_voice_mode.py:ro
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Upstream June 2026 gate: non-loopback dashboard bind requires a registered
      # provider. The image reads USERNAME (not USER) + PASSWORD or password_hash.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "dragon"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "dragon-local"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "dragon-local-dashboard-session-secret"
      # API defaults to 127.0.0.1 inside the container — docker-proxy then
      # publishes a host port that connection-closes. Bind all interfaces in
      # the container; host publish stays 127.0.0.1 only.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # Current -desktop image refuses keys shorter than 16 chars (api_server
      # never binds :8642). Default is a loopback-only placeholder. Honor an
      # existing long API_SERVER_KEY so installs Cos already healed stay intact.
      API_SERVER_KEY: ${API_SERVER_KEY:-dragon-local-key}
      API_SERVER_CORS_ORIGINS: "*"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',8642),2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Headless Desktop backend (JSON-RPC /api/ws + /api/display/ws). Must bind
  # loopback so token-mode Remote works; see start-desktop-serve.sh.
  hermes-desktop-serve:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-gateway:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-serve.sh"]
    volumes:
      - ${HERMES_EMBEDDED_DATA:-${USERPROFILE}/.hermes-airmaze-embedded}:/opt/data
      - ./scripts/airmaze/start-desktop-serve.sh:/opt/dragon/start-desktop-serve.sh:ro
      - ./scripts/airmaze/start-gateway.sh:/opt/dragon/start-gateway.sh:ro
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: "0"
      API_SERVER_ENABLED: "false"
      HERMES_DASHBOARD_SESSION_TOKEN: "dragon-local"
      DESKTOP_SERVE_HOST: "127.0.0.1"
      DESKTOP_SERVE_PORT: "8651"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8651/api/health', headers={'X-Hermes-Session-Token':'dragon-local'}), timeout=3)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 50s

  # 0.0.0.0:8650 → 127.0.0.1:8651 so Docker can publish the loopback serve.
  hermes-desktop-proxy:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop-proxy
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-desktop-serve:
        condition: service_started
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-proxy.sh"]
    volumes:
      - ./scripts/airmaze/desktop-loopback-proxy.py:/opt/dragon/desktop-loopback-proxy.py:ro
      - ./scripts/airmaze/start-desktop-proxy.sh:/opt/dragon/start-desktop-proxy.sh:ro

  # Browser web UI (hermes dashboard). This is what the product window loads.
  # Loopback bind + TCP proxy, same reason as serve: avoid the password gate.
  hermes-desktop-ui:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop-ui
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-gateway:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-ui.sh"]
    volumes:
      - ${HERMES_EMBEDDED_DATA:-${USERPROFILE}/.hermes-airmaze-embedded}:/opt/data
      - ./scripts/airmaze/start-desktop-ui.sh:/opt/dragon/start-desktop-ui.sh:ro
      - ./scripts/airmaze/start-gateway.sh:/opt/dragon/start-gateway.sh:ro
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "false"
      HERMES_DASHBOARD_SESSION_TOKEN: "dragon-local"
      DESKTOP_UI_HOST: "127.0.0.1"
      DESKTOP_UI_PORT: "8652"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; b=urllib.request.urlopen('http://127.0.0.1:8652/', timeout=3).read(); assert b'web UI disabled' not in b\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 50s

  # 0.0.0.0:8660 → 127.0.0.1:8652 so Docker can publish the loopback dashboard.
  hermes-desktop-ui-proxy:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop-ui-proxy
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-desktop-ui:
        condition: service_started
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-proxy.sh"]
    environment:
      DESKTOP_PROXY_LISTEN: "0.0.0.0:8660"
      DESKTOP_PROXY_UPSTREAM: "127.0.0.1:8652"
    volumes:
      - ./scripts/airmaze/desktop-loopback-proxy.py:/opt/dragon/desktop-loopback-proxy.py:ro
      - ./scripts/airmaze/start-desktop-proxy.sh:/opt/dragon/start-desktop-proxy.sh:ro
