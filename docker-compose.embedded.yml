# Dragon AI Agent — embedded gateway (Bot Screen capable)
# Windows + Docker Desktop Linux engine. Bind to loopback only.
#
# Usage:
#   docker compose -f docker-compose.embedded.yml pull
#   docker compose -f docker-compose.embedded.yml up -d
#
# Image: official desktop-suffixed tag (TigerVNC + Xfce baked in).
# No secrets beyond local-only dashboard / Desktop-session placeholders below.
#
# Surfaces (all published on 127.0.0.1 only):
#   :8642  OpenAI-compatible API (`gateway run`) — NOT the Desktop Remote URL
#   :9119  Web dashboard (password-gated) — browser login, not Desktop token/WS
#   :8650  Desktop-compatible `hermes serve` (loopback + TCP proxy) — Open Screen

name: airmaze-embedded

services:
  hermes-gateway:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-gw
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
      # Shared by the desktop-serve sidecar (network_mode: service:hermes-gateway).
      - "127.0.0.1:8650:8650"
    volumes:
      - ${HERMES_EMBEDDED_DATA:-${USERPROFILE}/.hermes-airmaze-embedded}:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Upstream June 2026 gate: non-loopback dashboard bind requires a registered
      # provider. The image reads USERNAME (not USER) + PASSWORD or password_hash.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "dragon"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "dragon-local"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "dragon-local-dashboard-session-secret"
      # API defaults to 127.0.0.1 inside the container — docker-proxy then
      # publishes a host port that connection-closes. Bind all interfaces in
      # the container; host publish stays 127.0.0.1 only.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "dragon-local"
      API_SERVER_CORS_ORIGINS: "*"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',8642),2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Headless Desktop backend (JSON-RPC /api/ws + /api/display/ws). Must bind
  # loopback so token-mode Remote works; see start-desktop-serve.sh.
  hermes-desktop-serve:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-gateway:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-serve.sh"]
    volumes:
      - ${HERMES_EMBEDDED_DATA:-${USERPROFILE}/.hermes-airmaze-embedded}:/opt/data
      - ./scripts/airmaze/start-desktop-serve.sh:/opt/dragon/start-desktop-serve.sh:ro
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: "0"
      API_SERVER_ENABLED: "false"
      HERMES_DASHBOARD_SESSION_TOKEN: "dragon-local"
      DESKTOP_SERVE_HOST: "127.0.0.1"
      DESKTOP_SERVE_PORT: "8651"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8651/api/health', headers={'X-Hermes-Session-Token':'dragon-local'}), timeout=3)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 50s

  # 0.0.0.0:8650 → 127.0.0.1:8651 so Docker can publish the loopback serve.
  hermes-desktop-proxy:
    image: nousresearch/hermes-agent:latest-desktop
    container_name: hermes-airmaze-desktop-proxy
    restart: unless-stopped
    network_mode: service:hermes-gateway
    depends_on:
      hermes-desktop-serve:
        condition: service_started
    entrypoint: ["/bin/sh", "/opt/dragon/start-desktop-proxy.sh"]
    volumes:
      - ./scripts/airmaze/desktop-loopback-proxy.py:/opt/dragon/desktop-loopback-proxy.py:ro
      - ./scripts/airmaze/start-desktop-proxy.sh:/opt/dragon/start-desktop-proxy.sh:ro
