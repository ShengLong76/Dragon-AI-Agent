name: Dragon branding guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    name: User-visible Hermes naming
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Fail if Dragon branding slipped
        run: python3 scripts/dragon/branding_guard.py
